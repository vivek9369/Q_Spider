<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration From</title>
    <style>
        div{
            align-items: center;
            background-color: pink;
        }
    </style>
</head>
<body>
    <form action="">
        <div>
        <label for="inp1">Full Name</label>
        <input type="text" id="inp1"><br> <br>
        <label for="inp2">Mobile</label>
        <input type="tel" id="inp2"><br> <br>
        <label for="">E-mail</label>
        <input type="email"><br><br>
        <label for="">Password</label>
        <input type="password"><br> <br>
        <label for="">Upload your pic:</label> <br>
        <input type="file"><br> <br>
        <label for="">Dob:</label> <br>
        <input type="datetime-local"> <br>
        <label for="">Addhar no:</label> <br>
        <input type="number"> <br>
        <label for="">Gender</label> <br>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Other <br> <br>
        <div>
            Agree with our T&C :
            <input type="checkbox">
        </div> <br>
        <button type="submit" style="background-color: rgb(204, 223, 135);">Submit</button>
        <button type="reset" style="background-color: red;">Cancel</button>
        </div>
    </form>
</body>
</html>
